<!DOCTYPE html>
<html lang="en" manifest="gamezone-v12.appcache?v=20261003-17-cache-audit">
<head>
  <meta charset="UTF-8">
  <title>GameZone GoldHEN for PS4 9.00</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(to bottom right, #063FAB, #01258A);
      background-image: url('icon0.jpg');
      background-size: cover;
      background-position: center;
      color: white;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    @font-face {
      font-family: 'logging';
      src: url('fonts/LiberationMono-Regular.ttf');
    }

    .card {
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      width: 90%;
      max-width: 700px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }

    h1 {
      font-size: 32px;
      margin-bottom: 20px;
    }

    #status {
      min-height: 34px;
      margin-bottom: 20px;
      color: #dceaff;
      font-size: 19px;
    }

    button {
      width: 100%;
      min-height: 62px;
      border: 2px solid #7ddcff;
      border-radius: 10px;
      background: #143f72;
      color: white;
      font-size: 22px;
      font-weight: bold;
    }

    button:disabled {
      opacity: .55;
    }

    .secondary {
      display: block;
      margin-top: 12px;
      color: #b8ddff;
      font-size: 16px;
    }

    #console {
      font-family: 'logging', monospace;
      font-size: 18px;
      text-align: left;
      background: rgba(0, 0, 0, 0.7);
      padding: 20px;
      border-radius: 10px;
      white-space: pre-wrap;
      min-height: 54px;
      max-height: 120px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>GameZone GoldHEN — Firmware 9.00</h1>
    <p id="status">Checking the complete offline starter…</p>
    <button id="start" type="button" disabled>Start GoldHEN</button>
    <button id="maintenance" class="secondary" type="button" disabled>Maintenance GoldHEN (no tracker AutoRun)</button>
    <button id="update-cache" class="secondary" type="button" disabled>Update offline copy (internet needed only for updates)</button>
    <pre id="console"></pre>
    <p class="secondary">Offline package GZ9 v18 · saved launch needs no Wi-Fi · one manual attempt</p>
  </div>

  <script type="module">
    const button = document.getElementById('start');
    const maintenance = document.getElementById('maintenance');
    const status = document.getElementById('status');
    const consoleOut = document.getElementById('console');
    const updateButton = document.getElementById('update-cache');
    const receiptKey = 'gamezone-900-installed-cache';
    let updating = false;
    let started = false;
    button.disabled = true;
    maintenance.disabled = true;

    function exactFirmware() {
      return /PlayStation 4[\\/ ]9\.00(?:\D|$)/.test(navigator.userAgent);
    }

    function ready(message) {
      if (started) return;
      if (!exactFirmware()) {
        button.disabled = true;
        status.textContent = 'STOP: this starter is only for PS4 firmware 9.00.';
        return;
      }
      button.disabled = false;
      maintenance.disabled = false;
      updateButton.disabled = false;
      // A receipt only lets us try cancelling an optional refresh. AppCache
      // must still confirm IDLE; storage alone never proves files are saved.
      try { localStorage.setItem(receiptKey, 'installed'); } catch (_) {}
      status.textContent = message || 'Offline ready. Press Start GoldHEN when you are ready.';
    }

    async function startGoldHEN(mode) {
      if (started) return;
      started = true;
      button.disabled = true;
      maintenance.disabled = true;
      updateButton.disabled = true;
      const recovery = mode === 'maintenance';
      const payloadPath = recovery ? './goldhen-2.4b18-maintenance.bin' : './payload.bin';
      const payloadSize = recovery ? 260160 : 290016;
      status.textContent = recovery ? 'Loading maintenance GoldHEN without tracker AutoRun…' : 'Loading the verified GameZone GoldHEN payload…';
      consoleOut.textContent = '';
      try {
        const response = await fetch(payloadPath);
        if (!response.ok) throw new Error('Payload download failed: HTTP ' + response.status);
        const binary = await response.arrayBuffer();
        if (binary.byteLength !== payloadSize) throw new Error('Payload verification failed: unexpected size');
        const patchResponse = await fetch('./kpatch/900.elf');
        if (!patchResponse.ok) throw new Error('Kernel patch load failed: HTTP ' + patchResponse.status);
        const patchBinary = await patchResponse.arrayBuffer();
        if (patchBinary.byteLength !== 5288) throw new Error('Kernel patch verification failed: unexpected size');
        const aioResponse = await fetch('./aio_patches.bin');
        if (!aioResponse.ok) throw new Error('AIO stability patch load failed: HTTP ' + aioResponse.status);
        const aioBinary = await aioResponse.arrayBuffer();
        if (aioBinary.byteLength !== 5588) throw new Error('AIO stability patch verification failed: unexpected size');
        window.gamezonePayloadBuffer = binary;
        window.gamezoneKpatchBuffer = patchBinary;
        window.gamezoneAioBuffer = aioBinary;
        window.pld = new Uint32Array(binary);
        status.textContent = recovery ? 'Starting maintenance GoldHEN. The GameZone tracker will not AutoRun.' : 'Starting GoldHEN. Wait for the notification…';
        await import('./alert.mjs');
      } catch (error) {
        consoleOut.textContent = String(error && (error.message || error));
        status.textContent = 'GoldHEN did not start. Cold-restart the PS4 before another attempt.';
        // Deliberately do not re-enable the button. Repeated exploit attempts in
        // one browser session have a higher chance of a kernel panic.
      }
    }

    button.addEventListener('click', function () { startGoldHEN('managed'); });
    maintenance.addEventListener('click', function () { startGoldHEN('maintenance'); });

    if (!exactFirmware()) {
      button.disabled = true;
      maintenance.disabled = true;
      status.textContent = 'STOP: this starter is only for PS4 firmware 9.00.';
    } else {
      const cache = window.applicationCache;
      if (!cache) {
        status.textContent = 'Offline storage is unavailable. Reload with an internet connection.';
      } else {
        let savedBefore = false;
        try { savedBefore = localStorage.getItem(receiptKey) === 'installed'; } catch (_) {}
        function useSavedCopy() {
          if (started || updating) return false;
          if (savedBefore && (cache.status === cache.CHECKING || cache.status === cache.DOWNLOADING)) {
            // WebKit checks the manifest on every visit, even on Wi-Fi with
            // no WAN. Stop that optional refresh, not the installed cache.
            try { cache.abort(); } catch (_) {}
          }
          if (cache.status !== cache.IDLE) return false;
          savedBefore = true;
          ready('Offline ready. No Wi-Fi or internet is needed. Press Start GoldHEN.');
          return true;
        }
        function updateSaved() {
          if (started) return;
          try { localStorage.setItem(receiptKey, 'installed'); } catch (_) {}
          button.disabled = true;
          maintenance.disabled = true;
          updateButton.disabled = true;
          // Do not swap underneath an open page: its modules and binaries
          // must come from the same cache version after navigation.
          status.textContent = 'Offline update saved. Close and reopen this page to use it.';
        }
        updateButton.addEventListener('click', function () {
          if (started || updating || cache.status !== cache.IDLE) return;
          updating = true;
          button.disabled = true;
          maintenance.disabled = true;
          updateButton.disabled = true;
          status.textContent = 'Updating the offline copy. Internet is needed for this update only.';
          try { cache.update(); } catch (_) { updating = false; useSavedCopy(); }
        });
        cache.addEventListener('checking', function () { useSavedCopy(); }, false);
        cache.addEventListener('downloading', function () { useSavedCopy(); }, false);
        cache.addEventListener('progress', function (event) {
          if (started || (!updating && useSavedCopy())) return;
          if (event && event.total) status.textContent = 'Saving for offline use: ' + Math.round(event.loaded / event.total * 100) + '%';
        }, false);
        cache.addEventListener('cached', function () { updating = false; useSavedCopy(); }, false);
        cache.addEventListener('noupdate', function () { updating = false; useSavedCopy(); }, false);
        cache.addEventListener('updateready', updateSaved, false);
        cache.addEventListener('error', function () {
          // The PS4 browser may keep navigator.onLine=true after the WAN is
          // disconnected. Its manifest refresh then emits ERROR even though a
          // complete previously installed AppCache is still active (IDLE).
          // In that state the payload and exploit modules are safe to load
          // from the existing cache; only UNCACHED/OBSOLETE means no usable
          // offline installation exists.
          if (cache.status === cache.IDLE) {
            updating = false;
            savedBefore = true;
            ready('Offline cache loaded. Press Start GoldHEN when you are ready.');
            return;
          }
          if (cache.status === cache.UPDATEREADY) {
            updateSaved();
            return;
          }
          button.disabled = true;
          maintenance.disabled = true;
          updateButton.disabled = true;
          status.textContent = 'Offline cache is not installed. Connect once, reload, and wait for Offline ready.';
        }, false);
        cache.addEventListener('obsolete', function () {
          button.disabled = true;
          maintenance.disabled = true;
          updateButton.disabled = true;
          status.textContent = 'Offline package is obsolete. Reconnect and reload before starting.';
        }, false);
        if (cache.status === cache.UPDATEREADY) updateSaved();
        else if (!useSavedCopy()) status.textContent = 'First offline save is not complete. Connect to internet once and wait for Offline ready.';
      }
    }
  </script>
</body>
</html>
