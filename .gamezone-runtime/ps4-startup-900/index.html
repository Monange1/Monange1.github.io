<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GameZone GoldHEN for PS4 9.00</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(to bottom right, #063FAB, #01258A);
      background-image: url('icon0.jpg');
      background-size: cover;
      background-position: center;
      color: white;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    @font-face {
      font-family: 'logging';
      src: url('fonts/LiberationMono-Regular.ttf');
    }

    .card {
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      width: 90%;
      max-width: 700px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }

    h1 {
      font-size: 32px;
      margin-bottom: 20px;
    }

    #status {
      min-height: 34px;
      margin-bottom: 20px;
      color: #dceaff;
      font-size: 19px;
    }

    button {
      width: 100%;
      min-height: 62px;
      border: 2px solid #7ddcff;
      border-radius: 10px;
      background: #143f72;
      color: white;
      font-size: 22px;
      font-weight: bold;
    }

    button:disabled {
      opacity: .55;
    }

    #console {
      font-family: 'logging', monospace;
      font-size: 18px;
      text-align: left;
      background: rgba(0, 0, 0, 0.7);
      padding: 20px;
      border-radius: 10px;
      white-space: pre-wrap;
      min-height: 54px;
      max-height: 120px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>GameZone GoldHEN — Firmware 9.00</h1>
    <p id="status">Ready. GoldHEN will start only when you press the button.</p>
    <button id="start" type="button">Start GoldHEN</button>
    <pre id="console"></pre>
  </div>

  <script type="module">
    const button = document.getElementById('start');
    const status = document.getElementById('status');
    const consoleOut = document.getElementById('console');
    let started = false;

    button.addEventListener('click', async function () {
      if (started) return;
      started = true;
      button.disabled = true;
      status.textContent = 'Loading the verified GoldHEN payload…';
      consoleOut.textContent = '';
      try {
        const response = await fetch('./payload.bin');
        if (!response.ok) throw new Error('Payload download failed: HTTP ' + response.status);
        const binary = await response.arrayBuffer();
        if (binary.byteLength !== 290016) throw new Error('Payload verification failed: unexpected size');
        window.pld = new Uint32Array(binary);
        status.textContent = 'Starting GoldHEN. Wait for the notification…';
        await import('./alert.mjs');
      } catch (error) {
        consoleOut.textContent = String(error && (error.message || error));
        status.textContent = 'GoldHEN did not start. Cold-restart the PS4 before another attempt.';
        // Deliberately do not re-enable the button. Repeated exploit attempts in
        // one browser session have a higher chance of a kernel panic.
      }
    });
  </script>
</body>
</html>
