name: Publish GameZone PS4 hosts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Verify firmware hosts
        run: |
          node .github/scripts/validate-ps4-hosts.mjs
          node .github/scripts/test-ps4-host-safety.mjs
      - name: Assemble firmware-specific hosts
        run: |
          mkdir -p public/672 public/900 public/1100 public/start public/launch public/modern
          cp -a .gamezone-runtime/ps4-startup-900/. public/
          # A fresh 9.00 URL creates a separate PS4 AppCache group. Older
          # cached copies of / cannot intercept this first installation.
          cp -a .gamezone-runtime/ps4-startup-900/. public/900/
          # GitHub Pages maps extensionless /start to /start.html before it
          # considers the /start/ directory. Remove the old 9.00 compatibility
          # page from the published root so both /start and /start/ reach the
          # firmware router.
          rm -f public/start.html
          cp -a .gamezone-runtime/ps4-startup-672/. public/672/
          cp -a .gamezone-runtime/ps4-startup-1100/. public/1100/
          cp -a .gamezone-runtime/ps4-startup-router/. public/start/
          cp -a .gamezone-runtime/ps4-startup-router/. public/launch/
          cp -a .gamezone-runtime/ps4-startup-modern/. public/modern/
      - name: Upload GameZone PS4 hosts
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
